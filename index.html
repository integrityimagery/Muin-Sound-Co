<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muin Sound Co. — Custom Music for Weddings, Parties &amp; Tabletop Gaming</title>
    <meta
      name="description"
      content="Muin Sound Co. writes and produces original songs and soundtracks for your wedding, themed party or tabletop gaming campaign."
    />
    <link rel="canonical" href="https://muinsound.co/" />

    <!-- Icons, generated from the avatar mark in assets/images/. -->
    <link rel="icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Fonts: matched to the wordmark's hand-drawn, warm-folk lettering
         (Fraunces, at a light weight for the statement) and a comfortable
         body face (Alegreya Sans). Only the weights actually used are
         requested. display=swap so text never waits on the font to paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Alegreya+Sans:wght@400&display=swap"
    />

    <!-- The doors' CLOSED state is what paints first; preload it at high
         priority. The OPEN state is only needed on interaction, so it is
         preloaded too but at low priority — it should not compete with
         anything visible on first paint. -->
    <link rel="preload" as="image" href="assets/images/weddings-closed.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/parties-closed.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/gaming-closed.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/weddings-open.webp" type="image/webp" fetchpriority="low" />
    <link rel="preload" as="image" href="assets/images/parties-open.webp" type="image/webp" fetchpriority="low" />
    <link rel="preload" as="image" href="assets/images/gaming-open.webp" type="image/webp" fetchpriority="low" />

    <!-- Open Graph / Twitter. muinsound.co is a PLACEHOLDER domain (no CNAME
         exists yet) — update every absolute URL below once a real domain is
         set, including the canonical link above and the JSON-LD block. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muin Sound Co." />
    <meta property="og:title" content="Muin Sound Co. — Weddings, Parties &amp; Tabletop Gaming" />
    <meta
      property="og:description"
      content="Original songs and soundtracks for your wedding, themed party or tabletop gaming campaign."
    />
    <meta property="og:url" content="https://muinsound.co/" />
    <meta property="og:image" content="https://muinsound.co/assets/images/cottagecore-2a-lockup.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Muin Sound Co.",
        "url": "https://muinsound.co/",
        "logo": "https://muinsound.co/assets/images/cottagecore-2a-avatar.png"
      }
    </script>
    <!-- PLACEHOLDER: add a "sameAs" array of real social profile URLs above
         once they exist. Omitted rather than filled with invented links. -->
  </head>

  <body>
    <!-- Purely decorative. Fixed to the viewport, not the content, so it
         frames the page rather than scrolling with it — and stays out of the
         accessibility tree entirely. -->
    <div class="frame" aria-hidden="true">
      <!-- One mark, drawn once for the top-left corner; the other three
           corners mirror it in CSS (scaleX/scaleY) rather than repeating
           hand-tuned path data three more times. -->
      <span class="frame__corner frame__corner--tl">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
      <span class="frame__corner frame__corner--tr">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
      <span class="frame__corner frame__corner--bl">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
      <span class="frame__corner frame__corner--br">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
    </div>

    <main class="page">
      <h1 class="statement">
        Muin Sound Co. writes and produces original songs and soundtracks for your
        wedding, themed party or tabletop gaming campaign.
      </h1>

      <!-- The three doors ARE the site's navigation — there is no separate
           nav bar. Still marked up as a <nav> landmark, which is the correct
           semantic home for "the only way through this page." -->
      <nav class="doors" aria-label="Choose your occasion">
        <a class="door" href="weddings" aria-label="Weddings">
          <span class="door__frame">
            <picture>
              <source srcset="assets/images/weddings-closed.webp" type="image/webp" />
              <img
                class="door__img door__img--closed"
                src="assets/images/weddings-closed.png"
                alt=""
                width="600"
                height="800"
                fetchpriority="high"
              />
            </picture>
            <picture>
              <source srcset="assets/images/weddings-open.webp" type="image/webp" />
              <img
                class="door__img door__img--open"
                src="assets/images/weddings-open.png"
                alt=""
                width="600"
                height="800"
                fetchpriority="low"
              />
            </picture>
          </span>
        </a>

        <a class="door" href="parties" aria-label="Parties">
          <span class="door__frame">
            <picture>
              <source srcset="assets/images/parties-closed.webp" type="image/webp" />
              <img
                class="door__img door__img--closed"
                src="assets/images/parties-closed.png"
                alt=""
                width="600"
                height="800"
                fetchpriority="high"
              />
            </picture>
            <picture>
              <source srcset="assets/images/parties-open.webp" type="image/webp" />
              <img
                class="door__img door__img--open"
                src="assets/images/parties-open.png"
                alt=""
                width="600"
                height="800"
                fetchpriority="low"
              />
            </picture>
          </span>
        </a>

        <a class="door" href="gaming" aria-label="Gaming">
          <span class="door__frame">
            <picture>
              <source srcset="assets/images/gaming-closed.webp" type="image/webp" />
              <img
                class="door__img door__img--closed"
                src="assets/images/gaming-closed.png"
                alt=""
                width="600"
                height="800"
                fetchpriority="high"
              />
            </picture>
            <picture>
              <source srcset="assets/images/gaming-open.webp" type="image/webp" />
              <img
                class="door__img door__img--open"
                src="assets/images/gaming-open.png"
                alt=""
                width="600"
                height="800"
                fetchpriority="low"
              />
            </picture>
          </span>
        </a>
      </nav>
    </main>

    <footer class="site-footer">
      <!-- The wordmark is the only content here. It carries the same
           non-empty alt the lockup did up top — it is now the sole visible
           text identifying the business anywhere on the page. -->
      <picture>
        <source srcset="assets/images/cottagecore-2a-wordmark.webp" type="image/webp" />
        <img
          src="assets/images/cottagecore-2a-wordmark.png"
          alt="Muin Sound Co."
          width="440"
          height="183"
          loading="lazy"
        />
      </picture>
    </footer>
  </body>
</html>
