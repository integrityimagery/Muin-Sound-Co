<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muin Sound Co. — Custom Music for Weddings, Parties &amp; Tabletop Gaming</title>
    <meta
      name="description"
      content="Muin Sound Co. writes and produces original songs and soundtracks for your wedding, themed party or tabletop gaming campaign."
    />
    <!-- Explicit rather than relying on the (identical) default, so an
         automated audit finds a stated policy rather than an absence. -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://muinsound.co/" />
    <!-- Tints mobile browser chrome (the URL bar, task switcher) to match
         the page background rather than defaulting to white or black. -->
    <meta name="theme-color" content="#f6eedd" />

    <!-- Icons, generated from the avatar mark in assets/images/. -->
    <link rel="icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Fonts: matched to the wordmark's hand-drawn, warm-folk lettering
         (Fraunces, at a light weight for the statement) and a comfortable
         body face (Alegreya Sans). Only the weights actually used are
         requested. display=swap so text never waits on the font to paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Alegreya+Sans:wght@400&display=swap"
    />

    <!-- The doors' CLOSED state is what paints first; preload it at high
         priority. The OPEN state is only needed on interaction, so it is
         preloaded too but at low priority — it should not compete with
         anything visible on first paint. -->
    <link rel="preload" as="image" href="assets/images/weddings-closed.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/parties-closed.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/gaming-closed.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/weddings-open.webp" type="image/webp" fetchpriority="low" />
    <link rel="preload" as="image" href="assets/images/parties-open.webp" type="image/webp" fetchpriority="low" />
    <link rel="preload" as="image" href="assets/images/gaming-open.webp" type="image/webp" fetchpriority="low" />

    <!-- Open Graph / Twitter. muinsound.co is a PLACEHOLDER domain (no CNAME
         exists yet) — update every absolute URL below once a real domain is
         set, including the canonical link above and the JSON-LD block. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muin Sound Co." />
    <meta property="og:title" content="Muin Sound Co. — Weddings, Parties &amp; Tabletop Gaming" />
    <meta
      property="og:description"
      content="Original songs and soundtracks for your wedding, themed party or tabletop gaming campaign."
    />
    <meta property="og:url" content="https://muinsound.co/" />
    <meta property="og:locale" content="en_US" />
    <!-- The lockup, at its native size — there's no purpose-built 1200x630
         social card yet. Width/height are given so consuming platforms can
         lay out the card without fetching the image first; omitting them
         doesn't break sharing, but it does make some platforms guess. -->
    <meta property="og:image" content="https://muinsound.co/assets/images/cottagecore-2a-lockup.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="920" />
    <meta property="og:image:alt" content="Muin Sound Co." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muin Sound Co. — Weddings, Parties &amp; Tabletop Gaming" />
    <meta
      name="twitter:description"
      content="Original songs and soundtracks for your wedding, themed party or tabletop gaming campaign."
    />
    <meta name="twitter:image" content="https://muinsound.co/assets/images/cottagecore-2a-lockup.png" />
    <meta name="twitter:image:alt" content="Muin Sound Co." />

    <link rel="stylesheet" href="styles.css" />

    <!-- One @graph rather than several separate <script> blocks, so entities
         can reference each other by @id (the Yoast/Google-recommended
         pattern) instead of repeating the same facts three times.

         Three Service entities below, one per door. Their name/description
         are deliberately built ONLY from words already on this page — the
         h1 statement, split by category — with nothing added that isn't
         there: no price, no turnaround time, no service area, no reviews.
         Structured data claiming any of that would not match visible page
         content, which is exactly what Google's guidelines warn against, and
         none of it exists here to draw from honestly. Still deliberately NOT
         included: Offer.price and FAQPage — same reason. Each Service's own
         page (once built) is where the real depth belongs; this is only what
         the entry page itself actually says. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://muinsound.co/#organization",
            "name": "Muin Sound Co.",
            "url": "https://muinsound.co/",
            "description": "Muin Sound Co. writes and produces original songs and soundtracks for weddings, themed parties, and tabletop gaming campaigns.",
            "logo": {
              "@type": "ImageObject",
              "url": "https://muinsound.co/assets/images/cottagecore-2a-avatar.png",
              "width": 720,
              "height": 720
            },
            "image": { "@id": "https://muinsound.co/#logo" },
            "knowsAbout": [
              "Wedding music composition",
              "Custom party music",
              "Tabletop gaming soundtracks"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://muinsound.co/#website",
            "url": "https://muinsound.co/",
            "name": "Muin Sound Co.",
            "publisher": { "@id": "https://muinsound.co/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "WebPage",
            "@id": "https://muinsound.co/#webpage",
            "url": "https://muinsound.co/",
            "name": "Muin Sound Co. — Custom Music for Weddings, Parties & Tabletop Gaming",
            "description": "Muin Sound Co. writes and produces original songs and soundtracks for your wedding, themed party or tabletop gaming campaign.",
            "isPartOf": { "@id": "https://muinsound.co/#website" },
            "about": { "@id": "https://muinsound.co/#organization" },
            "primaryImageOfPage": {
              "@type": "ImageObject",
              "@id": "https://muinsound.co/#logo",
              "url": "https://muinsound.co/assets/images/cottagecore-2a-lockup.png",
              "width": 1200,
              "height": 920
            },
            "inLanguage": "en",
            "mainEntity": [
              { "@id": "https://muinsound.co/#service-weddings" },
              { "@id": "https://muinsound.co/#service-parties" },
              { "@id": "https://muinsound.co/#service-gaming" }
            ],
            "hasPart": [
              {
                "@type": "SiteNavigationElement",
                "name": "Weddings",
                "url": "https://muinsound.co/weddings"
              },
              {
                "@type": "SiteNavigationElement",
                "name": "Parties",
                "url": "https://muinsound.co/parties"
              },
              {
                "@type": "SiteNavigationElement",
                "name": "Gaming",
                "url": "https://muinsound.co/gaming"
              }
            ]
          },
          {
            "@type": "Service",
            "@id": "https://muinsound.co/#service-weddings",
            "name": "Wedding Music",
            "serviceType": "Custom wedding song composition",
            "description": "An original song, written and produced for your wedding, from Muin Sound Co.",
            "provider": { "@id": "https://muinsound.co/#organization" },
            "url": "https://muinsound.co/weddings"
          },
          {
            "@type": "Service",
            "@id": "https://muinsound.co/#service-parties",
            "name": "Party Music",
            "serviceType": "Custom music for themed parties",
            "description": "Original music, written and produced for your themed party, from Muin Sound Co.",
            "provider": { "@id": "https://muinsound.co/#organization" },
            "url": "https://muinsound.co/parties"
          },
          {
            "@type": "Service",
            "@id": "https://muinsound.co/#service-gaming",
            "name": "Tabletop Gaming Soundtracks",
            "serviceType": "Custom soundtrack composition for tabletop gaming",
            "description": "An original soundtrack, written and produced for your tabletop gaming campaign, from Muin Sound Co.",
            "provider": { "@id": "https://muinsound.co/#organization" },
            "url": "https://muinsound.co/gaming"
          }
        ]
      }
    </script>
    <!-- PLACEHOLDER: add a "sameAs" array of real social profile URLs to the
         Organization entity above once they exist. Omitted rather than
         filled with invented links. -->
  </head>

  <body>
    <!-- Purely decorative. Fixed to the viewport, not the content, so it
         frames the page rather than scrolling with it — and stays out of the
         accessibility tree entirely. -->
    <div class="frame" aria-hidden="true">
      <!-- One mark, drawn once for the top-left corner; the other three
           corners mirror it in CSS (scaleX/scaleY) rather than repeating
           hand-tuned path data three more times. -->
      <span class="frame__corner frame__corner--tl">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
      <span class="frame__corner frame__corner--tr">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
      <span class="frame__corner frame__corner--bl">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
      <span class="frame__corner frame__corner--br">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="frame__stem" d="M2 22 C2 10, 10 2, 22 2" />
          <path class="frame__leaf" d="M9 10 C11 6, 15 6, 16 9 C13 11, 10 13, 9 10 Z" />
          <path class="frame__leaf" d="M17 4 C19 1, 23 2, 23 5 C20 6, 17 7, 17 4 Z" />
        </svg>
      </span>
    </div>

    <main class="page">
      <h1 class="statement">
        Muin Sound Co. writes and produces original songs and soundtracks for your
        wedding, themed party or tabletop gaming campaign.
      </h1>

      <!-- The three doors ARE the site's navigation — there is no separate
           nav bar. Still marked up as a <nav> landmark, which is the correct
           semantic home for "the only way through this page." -->
      <nav class="doors" aria-label="Choose your occasion">
        <a class="door" href="weddings" aria-label="Weddings">
          <span class="door__frame">
            <picture>
              <source srcset="assets/images/weddings-closed.webp" type="image/webp" />
              <img
                class="door__img door__img--closed"
                src="assets/images/weddings-closed.png"
                alt="An arched double door twined with a rose vine, a WEDDINGS sign above it, closed"
                width="600"
                height="800"
                fetchpriority="high"
              />
            </picture>
            <picture>
              <source srcset="assets/images/weddings-open.webp" type="image/webp" />
              <img
                class="door__img door__img--open"
                src="assets/images/weddings-open.png"
                alt="The same rose-twined arched doorway standing open, revealing a candlelit aisle inside"
                width="600"
                height="800"
                fetchpriority="low"
              />
            </picture>
          </span>
        </a>

        <a class="door" href="parties" aria-label="Parties">
          <span class="door__frame">
            <picture>
              <source srcset="assets/images/parties-closed.webp" type="image/webp" />
              <img
                class="door__img door__img--closed"
                src="assets/images/parties-closed.png"
                alt="An arched door flanked by two hanging lanterns, a PARTIES sign hanging on it, closed"
                width="600"
                height="800"
                fetchpriority="high"
              />
            </picture>
            <picture>
              <source srcset="assets/images/parties-open.webp" type="image/webp" />
              <img
                class="door__img door__img--open"
                src="assets/images/parties-open.png"
                alt="The lantern-flanked door standing open, revealing paper lanterns strung inside"
                width="600"
                height="800"
                fetchpriority="low"
              />
            </picture>
          </span>
        </a>

        <a class="door" href="gaming" aria-label="Gaming">
          <span class="door__frame">
            <picture>
              <source srcset="assets/images/gaming-closed.webp" type="image/webp" />
              <img
                class="door__img door__img--closed"
                src="assets/images/gaming-closed.png"
                alt="A wooden tavern-style door with a small windowed grille and a GAMING sign, closed"
                width="600"
                height="800"
                fetchpriority="high"
              />
            </picture>
            <picture>
              <source srcset="assets/images/gaming-open.webp" type="image/webp" />
              <img
                class="door__img door__img--open"
                src="assets/images/gaming-open.png"
                alt="The tavern door standing open, revealing a round table under a hanging lamp inside"
                width="600"
                height="800"
                fetchpriority="low"
              />
            </picture>
          </span>
        </a>
      </nav>
    </main>

    <footer class="site-footer">
      <!-- The wordmark is the only content here. It carries the same
           non-empty alt the lockup did up top — it is now the sole visible
           text identifying the business anywhere on the page. -->
      <picture>
        <source srcset="assets/images/cottagecore-2a-wordmark.webp" type="image/webp" />
        <img
          src="assets/images/cottagecore-2a-wordmark.png"
          alt="Muin Sound Co."
          width="440"
          height="183"
          loading="lazy"
        />
      </picture>
    </footer>
  </body>
</html>
