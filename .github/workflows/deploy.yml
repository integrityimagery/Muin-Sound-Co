name: Deploy to GitHub Pages

# No build step. The site is served exactly as it sits in the repo — this
# workflow's only job is to hand the site files to GitHub Pages, which is why
# it exists at all: the repo's Pages source is set to "GitHub Actions" (a
# one-time setting in repo Settings -> Pages), and that source requires SOME
# workflow to produce a Pages artifact even when there is nothing to compile.

on:
  push:
    branches:
      - main
      - claude/image-assets-folder-2tm1x3
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stage an ALLOWLIST of the actual site files rather than uploading the
      # checkout directory as-is. actions/checkout leaves a .git directory in
      # the working copy, and uploading the repo root wholesale would publish
      # it (and .github, and anything else that shows up here later) as
      # static files on the live site. Naming exactly what belongs on Pages
      # is what keeps that from ever happening by accident.
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html styles.css favicon.ico favicon-32.png apple-touch-icon.png _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
